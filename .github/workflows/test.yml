name: PR tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run Python tests
        run: python -m pytest -q

      - name: Check pinned toolchain wiring
        run: bash tests/test_lsp_version_pinning.sh

      - name: Check standalone provider secrets
        run: bash tests/test_standalone_provider_secrets.sh

  trusted-image-build:
    name: Build image for trusted PRs
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version

      - name: Build image locally without pushing
        run: >-
          make build-opencode REGISTRY=localhost
          IMAGE_TAG=pr-${{ github.event.number }} NOPROMPT=1 SAVE_DEFAULTS=0

      - name: Audit built image dependencies
        run: >-
          podman run --rm --entrypoint /bin/sh
          localhost/opencode:pr-${{ github.event.number }}
          -ec 'pip-audit --local'
